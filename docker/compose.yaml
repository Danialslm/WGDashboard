services:
  wgdashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    container_name: wgdashboard
    network_mode: host

    volumes:
      - ../amneziawg:/etc/amnezia/amneziawg
      - ../wireguard:/etc/wireguard
      - ../data:/data

    cap_add:
      - NET_ADMIN

  mariadb:
    image: mariadb:lts
    network_mode: host
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "wgdashboard"
      MYSQL_ROOT_HOST: "%"
    command:
      - --bind-address=127.0.0.1
      - --character_set_server=utf8mb4
      - --collation_server=utf8mb4_unicode_ci
      - --host-cache-size=0
      - --innodb-open-files=1024
      - --innodb-buffer-pool-size=256M
      - --binlog_expire_logs_seconds=1209600
      - --innodb-doublewrite=0
      - --general_log=0
      - --slow_query_log=1
      - --slow_query_log_file=/var/lib/mysql/slow.log
      - --long_query_time=2
      - --innodb_snapshot_isolation=0
    volumes:
      - ../database/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      start_interval: 3s
      interval: 10s
      timeout: 5s
      retries: 3

  phpmyadmin:
    container_name: phpmyadmin
    image: phpmyadmin:latest
    restart: always
    network_mode: host
    environment:
      PMA_HOST: 127.0.0.1
      APACHE_PORT: 8010
      UPLOAD_LIMIT: 1024M
    depends_on:
      mariadb:
        condition: service_healthy
